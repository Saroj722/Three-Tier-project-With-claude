services:
  mysql:
    image: mysql:8.0
    container_name: three-tier-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: taskdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - three-tier-net

  backend:
    build:
      context: ./backend
    container_name: three-tier-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: taskdb
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "4000:4000"
    networks:
      - three-tier-net

  frontend:
    build:
      context: ./frontend
    container_name: three-tier-frontend
    restart: unless-stopped
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 4000
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - three-tier-net

networks:
  three-tier-net:
    driver: bridge

volumes:
  mysql-data:
